services:
  mongodb:
    image: mongo:7.0
    container_name: nhtsa-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=nhtsa_comms
    restart: unless-stopped

  # Optional: MongoDB Express for GUI management
  mongo-express:
    image: mongo-express:1.0-20
    container_name: nhtsa-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
