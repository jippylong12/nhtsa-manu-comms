[project]
name = "nhtsa-manu-comms-api"
version = "1.0.0"
description = "NHTSA Manufacturer Communications API - Full Stack Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "motor>=3.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",
    "asyncpg>=0.29.0",
    "pymupdf>=1.24.0",
    "google-genai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Long lines here are prose or embedded SQL: the JSON-schema field descriptions
# in the LLM prompt, inline SQL subqueries, and test asserts that read worse
# wrapped than whole.
"src/jobs/llm.py" = ["E501"]
"src/corpus/service.py" = ["E501"]
"tests/*" = ["E501"]
"src/config.py" = ["E501"]
